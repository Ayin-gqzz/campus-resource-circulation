name: Maven build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload executable Jar
        uses: actions/upload-artifact@v4
        with:
          name: campus-resource-circulation-jar
          path: target/campus-resource-circulation-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
